name: Deploy Artisan Platform to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Navigating to application directory..."
            cd /home/ubuntu/artisan_platform
            
            echo "📥 Fetching latest code from GitHub..."
            git pull origin main
            
            echo "📦 Updating python dependencies..."
            source venv/bin/activate
            pip install -r requirement.txt
            
            echo "🔄 Restarting Streamlit Application..."
            # Safely clear out any running streamlit services
            pkill -f "streamlit run" || true
            
            # Start streamlit with a production-grade full output detachment string
            nohup venv/bin/streamlit run App.py --server.port 8501 --server.address 0.0.0.0 </dev/null >/home/ubuntu/artisan_platform/streamlit.log 2>&1 &
            
            # Give the system background process a moment to initialize
            sleep 2
            
            echo "✅ Deployment completed successfully!"
